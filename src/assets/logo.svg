<!-- public/logo.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="logoGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Círculo externo -->
  <circle cx="50" cy="50" r="48" fill="url(#logoGradient)" class="logo-circle" />
  
  <!-- Anel decorativo -->
  <circle cx="50" cy="50" r="42" stroke="white" stroke-width="2" stroke-dasharray="8 6" fill="none" opacity="0.3" />
  
  <!-- Letra M estilizada -->
  <path
    d="M28 32 L28 72 M28 32 L50 54 L72 32 L72 72"
    stroke="white"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  
  <!-- Ponto decorativo -->
  <circle cx="50" cy="76" r="5" fill="white" opacity="0.8" />
</svg>